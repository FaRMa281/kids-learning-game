[build]
  command = "npm run build"
  publish = "dist"

# API → внешний backend (замените хост). Порядок важен: сначала /api, потом SPA-fallback.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-HOST/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
