# Nginx: раздаёт собранный фронт и проксирует /api/ на backend.
# Используется в Dockerfile фронта; backend доступен по имени сервиса games-backend (docker-compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # service worker и манифест — не кэшировать агрессивно, иначе обновления не доедут
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # хэшированные ассеты Vite — навсегда
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # API → backend (/api/kids-learning/progress → games-backend:8001/kids-learning/progress)
    location /api/ {
        proxy_pass http://games-backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любой путь → index.html
    location / { try_files $uri $uri/ /index.html; }
}
