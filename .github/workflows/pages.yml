# Автодеплой фронта на GitHub Pages при каждом push в main.
# Settings → Pages → Source: "GitHub Actions" (включается один раз).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-learning-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kids-learning-game/package-lock.json
      - run: npm ci
      # режим pages: без backend'а, прогресс в localStorage; пути относительные (base './')
      - run: npm run build -- --mode pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kids-learning-game/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
